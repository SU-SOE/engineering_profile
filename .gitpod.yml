ports:
  - port: 3306
    onOpen: ignore
    visibility: private
  - port: 33060
    onOpen: ignore
    visibility: private
  - port: 8001
    onOpen: open-preview
    visibility: public
image: pookmish/drupal8ci:gitpod
tasks:
  - before: |
      mkdir -p ~/.ssh
      if [[ ! -z $SSH_PRIVATE_KEY ]]; then
          echo $SSH_PRIVATE_KEY | base64 -d > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      fi
      if [[ ! -z $GITCONFIG ]]; then
          echo $GITCONFIG | base64 -d > ~/.gitconfig && chmod 644 ~/.gitconfig
      fi
    init: >
      cd /workspace &&
      mv $GITPOD_REPO_ROOT profile &&
      git clone git@github.com:SU-SWS/ace-soegryphon.git $GITPOD_REPO_ROOT &&
      cd $GITPOD_REPO_ROOT &&
      export PREVIEW_FULL_URL=`gp url 8001` &&
      export PREVIEW_URL=${PREVIEW_FULL_URL#"https://"} &&
      export PROFILE_BRANCH=`cd ../profile && git rev-parse --abbrev-ref HEAD` &&
      composer install -n &&
      composer require su-soe/engineering_profile:"dev-$PROFILE_BRANCH || $PROFILE_BRANCH-dev" --no-update &&
      composer update su-soe/* &&
      rm -rf docroot/*/custom/* &&
      composer install --prefer-source --no-interaction &&
      cd $GITPOD_REPO_ROOT/docroot/profiles/custom/engineering_profile &&
      git remote set-url origin git@github.com:SU-SOE/engineering_profile.git &&
      cd $GITPOD_REPO_ROOT &&
      cp .gitpod/blt.yml blt/local.blt.yml &&
      mkdir -p docroot/sites/settings &&
      blt settings &&
      drush si engineering_profile -v -y &&
      drush cr &&
      drush cim -y
    command: |
      apache2ctl restart &&
      drush uli --uri=`gp url 8001` &&
      drush uli  --uri=`gp url 8001` | xargs gp preview --external &&
      git config core.fileMode false
